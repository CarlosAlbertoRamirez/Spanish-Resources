<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Español Pro: Subjuntivo Masterclass</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #22c55e;
            --wrong: #ef4444;
            --warning: #f59e0b;
            --info: #0ea5e9;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 95%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header { margin-bottom: 1rem; }
        .progress-container {
            height: 10px;
            background: #334155;
            border-radius: 5px;
            margin: 1rem 0;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--info));
            border-radius: 5px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .streak-badge { color: var(--warning); display: none; animation: bounce 0.5s infinite alternate; }

        .instruction {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--info);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .difficulty-tag {
            float: right;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            background: #334155;
        }
        .question-text { font-size: 1.4rem; margin-bottom: 1.5rem; line-height: 1.4; }

        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .opt-btn {
            background: #334155;
            border: 2px solid transparent;
            padding: 1rem;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #3d4b5f; }

        input[type="text"] {
            width: 100%;
            padding: 1.2rem;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .word-pill {
            display: inline-block;
            padding: 10px 18px;
            background: var(--accent);
            margin: 5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .actions { margin-top: 2rem; display: flex; gap: 1rem; }
        .btn-action { padding: 0.8rem 1.5rem; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; }
        .btn-hint { background: transparent; color: var(--warning); border: 1px solid var(--warning); }
        .btn-skip { background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); }
        .btn-submit { background: var(--accent); color: white; flex-grow: 1; }

        .feedback { margin-top: 1rem; padding: 1.2rem; border-radius: 12px; display: none; }
        .hint-text { color: var(--warning); font-style: italic; display: none; margin-top: 1rem; font-size: 0.9rem; border: 1px dashed var(--warning); padding: 10px; border-radius: 8px; }

        #timer-box { font-size: 1.2rem; font-weight: bold; color: var(--wrong); text-align: center; margin-bottom: 10px; display: none; }

        #result-screen { display: none; text-align: center; }
        .error-list { text-align: left; max-height: 350px; overflow-y: auto; background: #0f172a; padding: 1rem; border-radius: 12px; margin-top: 1rem; }
        .error-item { border-bottom: 1px solid #334155; padding: 12px 0; }

        /* Estilo para tu firma */
        .signature {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }
        .signature b { color: var(--info); }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    </style>
</head>
<body>

    <div class="app-container" id="quiz-screen">
        <div class="header">
            <div class="difficulty-tag" id="difficulty">FÁCIL</div>
            <div class="stats-bar">
                <span>PROGRESS: <span id="current-idx">1</span>/40</span>
                <span>SCORE: <span id="score-val">0</span></span>
                <span class="streak-badge" id="streak-val">🔥 Streak: 0</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="timer-box">⏳ <span id="seconds">15</span>s</div>

        <div id="question-area">
            <div class="instruction" id="instruction">Instruction</div>
            <div class="question-text" id="question">Cargando...</div>
            <div id="dynamic-content"></div>
        </div>

        <div class="feedback" id="feedback-box">
            <div id="feedback-title" style="font-weight: bold; font-size: 1.1rem; margin-bottom: 5px;"></div>
            <div id="explanation" style="font-size: 0.95rem; line-height: 1.4;"></div>
        </div>

        <div id="hint-text" class="hint-text"></div>

        <div class="actions">
            <button class="btn-action btn-hint" onclick="showHint()">Hint</button>
            <button class="btn-action btn-skip" id="skip-btn" onclick="skipQuestion()">Skip</button>
            <button class="btn-action btn-submit" id="submit-btn" onclick="checkResponse()">Check Answer</button>
        </div>

        <!-- TU FIRMA AQUÍ -->
        <div class="signature">
            By <b>Carlos</b> "Your Mexican Friend"
        </div>
    </div>

    <div class="app-container" id="result-screen">
        <h1>Results / Resultados</h1>
        <div style="display: flex; justify-content: space-around; margin: 2rem 0;">
            <div><div style="font-size: 2.5rem; font-weight: bold; color: var(--accent);" id="final-pct">0%</div>Accuracy</div>
            <div><div style="font-size: 2.5rem; font-weight: bold; color: var(--wrong);" id="final-errors">0</div>Mistakes</div>
        </div>
        <div class="error-list" id="error-list"></div>
        <div class="actions">
            <button class="btn-action btn-submit" onclick="location.reload()">Restart All</button>
            <button class="btn-action btn-hint" id="practice-errors-btn" onclick="restart(true)">Review Mistakes</button>
        </div>
        <div class="signature">
            By <b>Carlos</b> "Your Mexican Friend"
        </div>
    </div>

    <script>
        // Los datos del quiz y la lógica se mantienen iguales para asegurar funcionalidad
        const quizData = [
            { type: "multiple-choice", difficulty: "fácil", instruction: "Choose the correct form", question: "Espero que tú _____ (venir) a mi fiesta.", options: ["vienes", "vengas", "venir"], correctAnswer: "vengas", hint: "Wish + Subject change.", explanation: "The main verb expresses a wish for another person, requiring the subjunctive." },
            { type: "input", difficulty: "medio", instruction: "Type the correct verb form", question: "Cuando _____ (llegar) a casa hoy, te llamaré.", options: [], correctAnswer: "llegue", hint: "Future event with 'cuando'.", explanation: "Use subjunctive after 'cuando' when referring to a future action that hasn't happened yet." },
            { type: "classification", difficulty: "fácil", instruction: "Classify the mood", question: "Es fundamental comer sano.", options: ["Indicativo", "Subjuntivo", "Infinitivo"], correctAnswer: "Infinitivo", hint: "No 'que' connector.", explanation: "In impersonal expressions without a specific subject or 'que', the infinitive is used." },
            { type: "true-false", difficulty: "fácil", instruction: "True or False?", question: "The Indicative mood is used to express objective facts and certainties.", options: ["Verdadero", "Falso"], correctAnswer: "Verdadero", hint: "Basic function of the mood.", explanation: "Correct. Indicative describes the world as it is or as we perceive it as a fact." },
            { type: "error-correction", difficulty: "difícil", instruction: "Correct the error", question: "No creo que él viene mañana.", options: ["No creo que él viene mañana.", "No creo que él venga mañana.", "No creo que él venir mañana."], correctAnswer: "No creo que él venga mañana.", hint: "Negated opinion.", explanation: "Negating a verb of opinion (no creer) triggers the subjunctive in the secondary clause." },
            { type: "dialogue", difficulty: "medio", instruction: "Complete the dialogue", question: "—¿Buscas un empleado que hable chino?<br>—Sí, pero no _____ a nadie todavía.", options: ["encuentro", "encuentre", "encontrar"], correctAnswer: "encuentro", hint: "State of reality.", explanation: "The speaker is stating a current fact (I don't find anyone), so indicative is required." },
            { type: "word-order", difficulty: "medio", instruction: "Order the words", question: "que / No / sea / creo / verdad", options: ["No", "creo", "que", "sea", "verdad"], correctAnswer: "No creo que sea verdad", hint: "Start with the opinion verb.", explanation: "Sentence structure: Negative opinion + que + subjunctive." },
            { type: "multiple-choice", difficulty: "fácil", instruction: "Choose the correct form", question: "Quiero _____ (ir) al cine.", options: ["vaya", "ir", "voy"], correctAnswer: "ir", hint: "Same subject.", explanation: "When the subject of both verbs is the same, use the infinitive." },
            { type: "input", difficulty: "difícil", instruction: "Type the correct verb form", question: "Aunque _____ (llover) mañana, iré a la playa.", options: [], correctAnswer: "llueva", hint: "Future/Uncertain obstacle.", explanation: "'Aunque' takes subjunctive when the obstacle is a future hypothesis or uncertainty." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Choose the correct form", question: "Te recomiendo que _____ (hacer) ejercicio.", options: ["hagas", "haces", "hacer"], correctAnswer: "hagas", hint: "Recommendation.", explanation: "Verbs of advice or suggestion directed at someone else trigger the subjunctive." },
            { type: "classification", difficulty: "medio", instruction: "Classify the mood", question: "Ojalá mañana no llueva.", options: ["Indicativo", "Subjuntivo", "Infinitivo"], correctAnswer: "Subjuntivo", hint: "Pure wish.", explanation: "'Ojalá' is an invariable trigger for the subjunctive." },
            { type: "multiple-choice", difficulty: "difícil", instruction: "Choose the correct form", question: "Busco una secretaria que _____ (saber) inglés.", options: ["sepa", "sabe", "saber"], correctAnswer: "sepa", hint: "Unknown person.", explanation: "Subjunctive is used when looking for something/someone with specific traits that may not exist yet." },
            { type: "multiple-choice", difficulty: "fácil", instruction: "Choose the correct form", question: "Es verdad que ella _____ (estar) enferma.", options: ["esté", "está", "estar"], correctAnswer: "está", hint: "Certainty.", explanation: "Expressions of certainty (es verdad, es cierto) take the indicative." },
            { type: "input", difficulty: "medio", instruction: "Type the verb", question: "Dudo que _____ (tener) tiempo hoy.", options: [], correctAnswer: "tenga", hint: "Uncertainty.", explanation: "The verb 'dudar' casts doubt on the action, requiring the subjunctive." },
            { type: "true-false", difficulty: "fácil", instruction: "True or False?", question: "In the phrase 'Me gusta cantar', 'cantar' is in Subjunctive.", options: ["Verdadero", "Falso"], correctAnswer: "Falso", hint: "Check ending.", explanation: "It ends in -ar and has no specific subject; it's an infinitive." },
            { type: "error-correction", difficulty: "medio", instruction: "Correct the error", question: "Es necesario que tú estudias.", options: ["Es necesario que tú estudias.", "Es necesario que tú estudies.", "Es necesario estudiar."], correctAnswer: "Es necesario que tú estudies.", hint: "Impersonal + que.", explanation: "Impersonal expressions + 'que' + specific subject must use the subjunctive." },
            { type: "word-order", difficulty: "difícil", instruction: "Order the words", question: "que / pido / Te / me / ayudes", options: ["Te", "pido", "que", "me", "ayudes"], correctAnswer: "Te pido que me ayudes", hint: "Request verb first.", explanation: "Verbs of request + que + subjunctive." },
            { type: "multiple-choice", difficulty: "fácil", instruction: "Fast Mode - 15s", question: "Pienso que tú _____ razón.", options: ["tengas", "tienes", "tener"], correctAnswer: "tienes", timer: 15, hint: "Affirmative opinion.", explanation: "'Pienso que' (affirmative) expresses a belief/certainty, so indicative is used." },
            { type: "dialogue", difficulty: "difícil", instruction: "Complete the dialogue", question: "—¿Crees que ganaremos?<br>—No creo que _____ tan fácil.", options: ["sea", "es", "ser"], correctAnswer: "sea", hint: "Negative opinion.", explanation: "Negating the verb 'creer' in the answer requires the subjunctive." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Choose the correct form", question: "Me molesta que ellos _____ (fumar).", options: ["fuman", "fumen", "fumar"], correctAnswer: "fumen", hint: "Feeling/Emotion.", explanation: "Verbs of emotion (molestar, gustar) with a change of subject trigger the subjunctive." },
            { type: "classification", difficulty: "fácil", instruction: "Classify the mood", question: "Mañana voy al cine.", options: ["Indicativo", "Subjuntivo", "Infinitivo"], correctAnswer: "Indicativo", hint: "Reality/Fact.", explanation: "Regular statement about a future action perceived as certain." },
            { type: "input", difficulty: "difícil", instruction: "Type the verb", question: "Para que _____ (ser) feliz, vive el presente.", options: [], correctAnswer: "seas", hint: "Purpose.", explanation: "The conjunction 'para que' (so that) always triggers the subjunctive." },
            { type: "true-false", difficulty: "fácil", instruction: "True or False?", question: "Infinitive is used when there is no conjugated subject.", options: ["Verdadero", "Falso"], correctAnswer: "Verdadero", hint: "Neutral form.", explanation: "Correct. Infinitive is the base form and does not mark person or mood." },
            { type: "error-correction", difficulty: "medio", instruction: "Correct the error", question: "Busco un hotel que tiene wifi.", options: ["Busco un hotel que tiene wifi.", "Busco un hotel que tenga wifi.", "Busco un hotel con wifi."], correctAnswer: "Busco un hotel que tenga wifi.", hint: "Unknown target.", explanation: "Looking for an unspecified thing with certain traits requires the subjunctive." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Choose the correct form", question: "Dime cuando _____ (terminar).", options: ["terminas", "termines", "terminar"], correctAnswer: "termines", hint: "Future timing.", explanation: "Use subjunctive with 'cuando' for future intentions or commands." },
            { type: "input", difficulty: "fácil", instruction: "Type the verb", question: "Prefiero _____ (estudiar) solo.", options: [], correctAnswer: "estudiar", hint: "Same subject.", explanation: "Preference verb + same subject = infinitive." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Choose the correct form", question: "Es posible que _____ (ir) tarde.", options: ["vaya", "voy", "ir"], correctAnswer: "vaya", hint: "Probability.", explanation: "Probability/Possibility triggers the subjunctive because it's not a confirmed fact." },
            { type: "multiple-choice", difficulty: "difícil", instruction: "Fast Mode - 15s", question: "No hay nadie que _____ (querer) trabajar.", options: ["quiere", "quiera", "querer"], correctAnswer: "quiera", timer: 15, hint: "Non-existence.", explanation: "Negative antecedents (nadie, ninguno) always take the subjunctive." },
            { type: "dialogue", difficulty: "fácil", instruction: "Complete the dialogue", question: "—¿Qué quieres hacer?<br>—Quiero _____ una pizza.", options: ["comer", "coma", "como"], correctAnswer: "comer", hint: "Own wish.", explanation: "Wishing something for yourself (same subject) requires the infinitive." },
            { type: "word-order", difficulty: "medio", instruction: "Order the words", question: "pueda / Espero / que / venir", options: ["Espero", "que", "pueda", "venir"], correctAnswer: "Espero que pueda venir", hint: "Wish + possibility.", explanation: "Structure: Wish + que + Subjunctive + Infinitive." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Choose the correct form", question: "Me sorprende que _____ (hacer) frío.", options: ["haga", "hace", "hacer"], correctAnswer: "haga", hint: "Emotion.", explanation: "Emotional reactions to facts require the subjunctive." },
            { type: "input", difficulty: "medio", instruction: "Type the verb", question: "Tal vez _____ (ser) una buena idea.", options: [], correctAnswer: "sea", hint: "Doubt.", explanation: "'Tal vez' (maybe) commonly triggers subjunctive to show uncertainty." },
            { type: "classification", difficulty: "fácil", instruction: "Classify the mood", question: "Comer es necesario.", options: ["Indicativo", "Subjuntivo", "Infinitivo"], correctAnswer: "Infinitivo", hint: "Subject of sentence.", explanation: "Infinitives can function as the noun/subject of a sentence." },
            { type: "true-false", difficulty: "difícil", instruction: "True or False?", question: "'Aunque' + Indicative means the speaker considers the obstacle a fact.", options: ["Verdadero", "Falso"], correctAnswer: "Verdadero", hint: "Fact vs Hypothesis.", explanation: "Correct. 'Aunque llueve' (even though it is raining) vs 'Aunque llueva' (even if it rains)." },
            { type: "error-correction", difficulty: "medio", instruction: "Correct the error", question: "Le pido que me da dinero.", options: ["Le pido que me da dinero.", "Le pido que me dé dinero.", "Le pido dinero."], correctAnswer: "Le pido que me dé dinero.", hint: "Request.", explanation: "Petición + que requires subjunctive. 'Dé' has an accent to distinguish it from the preposition." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Choose correct form", question: "No me parece que _____ (tener) razón.", options: ["tengas", "tienes", "tener"], correctAnswer: "tengas", hint: "Negative opinion.", explanation: "Negating 'parecer que' activates the subjunctive." },
            { type: "input", difficulty: "fácil", instruction: "Type the verb", question: "Sé que tú _____ (ser) inteligente.", options: [], correctAnswer: "eres", hint: "Total certainty.", explanation: "The verb 'saber' in affirmative always uses the indicative." },
            { type: "multiple-choice", difficulty: "difícil", instruction: "Choose correct form", question: "Tan pronto como _____ (recibir) el paquete, avísame.", options: ["recibas", "recibes", "recibir"], correctAnswer: "recibas", hint: "Future time.", explanation: "Time conjunctions referring to the future require subjunctive." },
            { type: "dialogue", difficulty: "medio", instruction: "Complete the dialogue", question: "—¿Por qué no sales?<br>—Porque no quiero que mi madre me _____.", options: ["vea", "ve", "ver"], correctAnswer: "vea", hint: "Preventing an event.", explanation: "Negative wish + subject change = subjunctive." },
            { type: "multiple-choice", difficulty: "medio", instruction: "Fast Mode - 15s", question: "Antes de _____ (salir), apaga la luz.", options: ["salir", "salgas", "salga"], correctAnswer: "salir", timer: 15, hint: "Preposition.", explanation: "'Antes de' without 'que' is always followed by an infinitive." }
        ];

        let currentQuestions = [];
        let index = 0;
        let score = 0;
        let streak = 0;
        let errors = [];
        let timer;
        let selectedValue = null;

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function initQuiz(onlyErrors = false) {
            currentQuestions = onlyErrors ? shuffle([...errors.map(e => e.q)]) : shuffle([...quizData]);
            index = 0; score = 0; streak = 0; errors = [];
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[index];
            const content = document.getElementById('dynamic-content');
            content.innerHTML = '';
            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('hint-text').style.display = 'none';
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('current-idx').innerText = index + 1;
            document.getElementById('difficulty').innerText = q.difficulty.toUpperCase();
            document.getElementById('instruction').innerText = q.instruction;
            document.getElementById('question').innerHTML = q.question;
            document.getElementById('timer-box').style.display = q.timer ? 'block' : 'none';
            
            updateProgress();
            if (q.timer) startTimer(q.timer);

            if (['multiple-choice', 'classification', 'error-correction', 'dialogue', 'true-false'].includes(q.type)) {
                const grid = document.createElement('div');
                grid.className = 'options-container';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.opt-btn').forEach(b => b.style.borderColor = 'transparent');
                        btn.style.borderColor = 'var(--accent)';
                        selectedValue = opt;
                    };
                    grid.appendChild(btn);
                });
                content.appendChild(grid);
            } else if (q.type === 'input') {
                const input = document.createElement('input');
                input.type = 'text'; input.id = 'user-input'; input.placeholder = 'Type here...';
                content.appendChild(input);
            } else if (q.type === 'word-order') {
                const res = document.createElement('div'); res.id = 'word-res'; res.style.minHeight='40px'; res.style.borderBottom='2px solid #334155'; res.style.marginBottom='10px';
                const pool = document.createElement('div');
                shuffle([...q.options]).forEach(w => {
                    const s = document.createElement('span'); s.className='word-pill'; s.innerText=w;
                    s.onclick = () => s.parentElement === pool ? res.appendChild(s) : pool.appendChild(s);
                    pool.appendChild(s);
                });
                content.appendChild(res); content.appendChild(pool);
            }
        }

        function startTimer(s) {
            clearInterval(timer);
            let l = s; document.getElementById('seconds').innerText = l;
            timer = setInterval(() => { l--; document.getElementById('seconds').innerText = l; if(l<=0){ clearInterval(timer); checkResponse(true); } }, 1000);
        }

        function showHint() { 
            const h = document.getElementById('hint-text'); 
            h.innerText = `HINT: ${currentQuestions[index].hint}`; 
            h.style.display = 'block'; 
        }

        function skipQuestion() { clearInterval(timer); index++; index < currentQuestions.length ? loadQuestion() : showFinalResults(); }

        function checkResponse(timeout = false) {
            clearInterval(timer);
            const q = currentQuestions[index];
            let user = "";
            if(timeout) user = "[TIMEOUT]";
            else if(q.type==='input') user = document.getElementById('user-input').value.trim().toLowerCase();
            else if(q.type==='word-order') user = Array.from(document.getElementById('word-res').children).map(c=>c.innerText).join(' ');
            else user = selectedValue;

            const isCorrect = timeout ? false : (q.type==='input' ? user === q.correctAnswer.toLowerCase() : user === q.correctAnswer);
            
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';
            fb.style.background = isCorrect ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.15)';
            document.getElementById('feedback-title').innerText = isCorrect ? "EXCELLENT! ✨" : "NOT QUITE... 💡";
            document.getElementById('feedback-title').style.color = isCorrect ? "var(--correct)" : "var(--wrong)";
            document.getElementById('explanation').innerHTML = `<strong>Correct: ${q.correctAnswer}</strong><br><em>${q.explanation}</em>`;

            if(isCorrect) { score += 10 + (streak*2); streak++; } else { streak = 0; errors.push({q, user}); }
            
            document.getElementById('score-val').innerText = score;
            const badge = document.getElementById('streak-val');
            badge.innerText = `🔥 Streak: ${streak}`;
            badge.style.display = streak >= 3 ? 'inline' : 'none';

            document.getElementById('submit-btn').disabled = true;
            setTimeout(() => { index++; selectedValue=null; index < currentQuestions.length ? loadQuestion() : showFinalResults(); }, 3500);
        }

        function updateProgress() { document.getElementById('progress-bar').style.width = (index/currentQuestions.length)*100 + '%'; }

        function showFinalResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-pct').innerText = Math.round(((currentQuestions.length - errors.length)/currentQuestions.length)*100) + '%';
            document.getElementById('final-errors').innerText = errors.length;
            const list = document.getElementById('error-list');
            list.innerHTML = '<h3>Review your mistakes:</h3>';
            errors.forEach(e => {
                list.innerHTML += `<div class="error-item"><strong>Q:</strong> ${e.q.question}<br><span style="color:var(--wrong)">You said: ${e.user}</span> | <span style="color:var(--correct)">Correct: ${e.q.correctAnswer}</span><br><small><em>${e.q.explanation}</em></small></div>`;
            });
            document.getElementById('practice-errors-btn').style.display = errors.length > 0 ? 'block' : 'none';
        }

        window.onload = () => initQuiz();
    </script>
</body>
</html>
